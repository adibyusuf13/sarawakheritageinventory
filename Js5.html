function parseCSV(s) {
  const R = [];
  let r = [], f = '', Q = 0;
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (Q) {
      if (c == '"') {
        if (s[i + 1] == '"') {
          f += '"';
          i++;
        } else
          Q = 0;
      } else
        f += c;
    } else if (c == '"')
      Q = 1;
    else if (c == ',') {
      r.push(f);
      f = '';
    } else if (c == '\n' || c == '\r') {
      if (c == '\r' && s[i + 1] == '\n')
        i++;
      r.push(f);
      f = '';
      R.push(r);
      r = [];
    } else
      f += c;
  }
  if (f || r.length) {
    r.push(f);
    R.push(r);
  }
  const h = R.shift().map(x => x.trim().replace(/^\uFEFF/, ''));
  return R.filter(x => x.length > 1).map(x => Object.fromEntries(h.map((k, i) => [
    k,
    x[i]
  ])));
}

async function imp() {
  const f = $('#cf').files[0];
  if (!f)
    return;
  const rows = parseCSV(await f.text()), o = $('#ir');
  let ok = 0, er = [];
  for (let i = 0; i < rows.length; i += 60) {
    o.textContent = i + '/' + rows.length + '\u2026';
    const r = await call('import', { rows: rows.slice(i, i + 60) });
    if (!r.ok) {
      er.push(r.e);
      break;
    }
    ok += r.d.saved;
    er = er.concat(r.d.errors);
  }
  o.textContent = '\u2714 ' + ok + '/' + rows.length + '\n' + er.join('\n');
  await load();
}

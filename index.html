.mark{position:relative;width:132px;height:132px;display:grid;place-items:center;margin-bottom:28px}

.tag{margin:8px 0 0;color:var(--mu);font-size:14.5px;animation:fade .7s .2s both}

  var TXT={

  var splash=document.getElementById('splash'),frame=document.getElementById('app'),msg=document.getElementById('msg'),sub=document.getElementById('sub'),retry=document.getElementById('retry'),openA=document.getElementById('open'),slowT=0,loaded=false,t0=Date.now();

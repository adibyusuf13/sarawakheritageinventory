<!DOCTYPE html>
<html lang="en" class="app">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sarawak Heritage Inventory</title>
<meta name="description" content="Sarawak Heritage Inventory. For authorised heritage staff.">
<meta name="theme-color" content="#0F3B36">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SK Heritage">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="manifest" href="manifest.webmanifest">
<script>
/* Launcher only: this page shows the splash screen and opens the app full screen in the same window. ?direct opens the Apps Script page itself. */
(function(){if(/[?&]direct\b/.test(location.search))location.replace('https://script.google.com/macros/s/AKfycbx1VfjwT4hq_0V9Vl3KozkIWdCy2XC8H7LgF75hMNcMQlep2bg4EsKyIzcmY5bUT1fZ/exec')})();
</script>
<style>
:root{--serif:"Source Serif 4","Iowan Old Style",Georgia,"Times New Roman",serif;--sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--bg:#0F3B36;--hi:#1F6A66;--lo:#052221;--tx:#EAF6F4;--mu:#B5D6D2;--gold:#FFE7A8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
#app{position:fixed;top:env(safe-area-inset-top,0px);right:0;bottom:0;left:0;width:100%;height:calc(100% - env(safe-area-inset-top,0px));border:0;background:var(--bg)}
/* splash */
#splash{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));text-align:center;background:radial-gradient(120% 80% at 50% 28%,#17524C 0%,var(--bg) 62%);transition:opacity .45s ease,visibility .45s}
#splash.gone{opacity:0;visibility:hidden;pointer-events:none}
.mark{position:relative;width:132px;height:132px;display:grid;place-items:center;margin-bottom:28px}
.mark:before{content:"";position:absolute;inset:-18px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,231,168,.20),rgba(255,231,168,0));animation:glow 3.2s ease-in-out infinite}
.mark img{position:relative;width:132px;height:132px;border-radius:30px;box-shadow:10px 10px 24px var(--lo),-8px -8px 20px var(--hi);animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
h1{margin:0;font:700 25px/1.2 var(--serif);letter-spacing:-.01em;animation:fade .7s .12s both}
.tag{margin:8px 0 0;color:var(--mu);font-size:14.5px;animation:fade .7s .2s both}
#state{margin-top:38px;min-height:84px;display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;max-width:320px}
#trk{width:168px;height:6px;border-radius:3px;background:#0A302D;box-shadow:inset 2px 2px 4px var(--lo),inset -2px -2px 4px var(--hi);overflow:hidden;position:relative}
#trk i{position:absolute;top:0;bottom:0;left:0;width:42%;border-radius:3px;background:linear-gradient(90deg,#1F8A85,var(--gold));animation:slide 1.5s cubic-bezier(.45,0,.2,1) infinite}
#msg{font:600 15px/1.4 var(--sans)}
#sub{display:none;margin:0;color:var(--mu);font-size:14px;line-height:1.5}
#acts{display:none;flex-direction:column;gap:12px;width:100%}
#splash.slow #sub,#splash.off #sub,#splash.slow #acts,#splash.off #acts{display:flex}
#splash.slow #sub,#splash.off #sub{display:block}
#splash.slow #trk,#splash.off #trk{display:none}
#splash.off #acts .g{display:none}
.sb{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:16px;border:0;font:600 16px var(--sans);text-decoration:none;cursor:pointer;color:#fff;background:linear-gradient(180deg,#1F8A85,#0F4F4C);box-shadow:0 8px 18px rgba(2,20,19,.5),inset 0 1px 0 rgba(255,255,255,.2)}
.sb.g{background:var(--bg);color:var(--tx);box-shadow:6px 6px 14px var(--lo),-6px -6px 14px var(--hi)}
.sb:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
@keyframes slide{0%{left:-45%}100%{left:103%}}
@keyframes glow{0%,100%{opacity:.55;transform:scale(.96)}50%{opacity:1;transform:scale(1.06)}}
@keyframes rise{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
[lang=ms] [data-en],[lang=en] [data-ms]{display:none}
@media(prefers-reduced-motion:reduce){#splash{transition:none}.mark:before,.mark img,h1,.tag{animation:none}#trk i{animation:none;left:0;width:60%}}
</style>
</head>
<body>
<div id="splash" role="status" aria-live="polite">
 <div class="mark"><img src="apple-touch-icon.png" alt=""></div>
 <h1>Sarawak Heritage Inventory</h1>
 <p class="tag"><span data-en>Heritage sites and antiquities</span><span data-ms>Tapak warisan dan antikuiti</span></p>
 <div id="state">
  <div id="trk" aria-hidden="true"><i></i></div>
  <div id="msg"></div>
  <p id="sub"></p>
  <div id="acts"><button type="button" class="sb" id="retry"></button><a class="sb g" id="open" target="_top"></a></div>
 </div>
</div>
<iframe id="app" title="Sarawak Heritage Inventory" allow="clipboard-write; fullscreen; geolocation"></iframe>
<script>
(function(){
  var APP='https://script.google.com/macros/s/AKfycbx1VfjwT4hq_0V9Vl3KozkIWdCy2XC8H7LgF75hMNcMQlep2bg4EsKyIzcmY5bUT1fZ/exec';
  var L='en';try{L=localStorage.getItem('shi_land')||((navigator.language||'').slice(0,2)=='ms'?'ms':'en')}catch(e){}
  document.documentElement.lang=L=='ms'?'ms':'en';
  /* Skip the app's own intro page: when the app says it is ready, send it straight to its sign-in card (never a password). */
  var pending={go:'in',user:''};
  /* Keeps the device ID for two-step sign-in (the app asks this page for it). */
  window.addEventListener('message',function(e){
    var d=e.data;if(!d||!/^https:\/\/([a-z0-9-]+\.)*(googleusercontent|google)\.com$/.test(e.origin))return;
    if(d.shiDev==='get'){var v='';try{v=localStorage.getItem('shi_dev_top')||''}catch(x){}
      if(!/^[0-9a-f]{32}$/.test(v)){var a=new Uint8Array(16);(window.crypto||{}).getRandomValues&&crypto.getRandomValues(a);v=Array.prototype.map.call(a,function(b){return('0'+b.toString(16)).slice(-2)}).join('');try{localStorage.setItem('shi_dev_top',v)}catch(x){}}
      try{e.source.postMessage({shiDev:v},e.origin)}catch(x){}}
    else if(d.shiReady){if(pending){try{e.source.postMessage({shiGo:pending.go,shiUser:pending.user},e.origin)}catch(x){}pending=null}setTimeout(reveal,250)}
  });
  var TXT={
   en:{load:'Opening the inventory…',slow:'Still loading.',slowSub:'This can take a moment on a slow connection. You can keep waiting, try again, or open the app in your browser.',off:'You are offline.',offSub:'Connect to Wi-Fi or mobile data, then try again.',retry:'Try again',browser:'Open in browser'},
   ms:{load:'Membuka inventori…',slow:'Masih memuatkan.',slowSub:'Ini mungkin mengambil sedikit masa jika sambungan perlahan. Anda boleh terus menunggu, cuba lagi, atau buka aplikasi dalam pelayar.',off:'Anda di luar talian.',offSub:'Sambung ke Wi-Fi atau data mudah alih, kemudian cuba lagi.',retry:'Cuba lagi',browser:'Buka dalam pelayar'}};
  var splash=document.getElementById('splash'),frame=document.getElementById('app'),msg=document.getElementById('msg'),sub=document.getElementById('sub'),retry=document.getElementById('retry'),openA=document.getElementById('open'),slowT=0,loaded=false,t0=Date.now();
  function T(){return TXT[document.documentElement.lang=='ms'?'ms':'en']}
  function state(k){var t=T();splash.classList.remove('slow','off');
    if(k=='slow'){splash.classList.add('slow');msg.textContent=t.slow;sub.textContent=t.slowSub}
    else if(k=='off'){splash.classList.add('off');msg.textContent=t.off;sub.textContent=t.offSub}
    else msg.textContent=t.load;
    retry.textContent=t.retry;openA.textContent=t.browser}
  function load(){loaded=false;shown=false;splash.classList.remove('gone');t0=Date.now();clearTimeout(slowT);
    if(navigator.onLine===false){state('off');return}
    state('load');
    /* A retry replaces the frame address so it adds no history entries. */
    if(!frame.getAttribute('src'))frame.src=APP;else{try{frame.contentWindow.location.replace(APP)}catch(x){frame.src=APP}}
    slowT=setTimeout(function(){if(!loaded)state('slow')},12000)}
  /* The splash stays until the app says it has drawn its first screen (or 4 s after the page loads), so there is never a blank flash between them. */
  var shown=false;
  function reveal(){if(shown)return;shown=true;loaded=true;clearTimeout(slowT);
    /* Show the splash for at least 0.9 s so it never flashes. */
    setTimeout(function(){
      /* The app page flips in as the splash lifts, so the flip is seen (it cannot play behind the splash). */
      var still=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
      if(!still&&frame.animate){
        frame.style.transformOrigin='50% 50%';
        frame.animate([{transform:'perspective(1100px) rotateY(-80deg)',opacity:.15},{transform:'perspective(1100px) rotateY(0deg)',opacity:1}],{duration:520,easing:'cubic-bezier(.2,.7,.2,1)'})}
      splash.classList.remove('slow','off');splash.classList.add('gone')},Math.max(0,900-(Date.now()-t0)))}
  frame.addEventListener('load',function(){clearTimeout(slowT);setTimeout(reveal,4000)});
  retry.addEventListener('click',load);
  window.addEventListener('online',function(){if(!loaded)load()});
  window.addEventListener('offline',function(){if(!loaded){clearTimeout(slowT);state('off')}});
  openA.href=APP;
  load();
})();
</script>
</body>
</html>
